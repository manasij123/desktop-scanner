name: build-and-release

# Push a version tag to cut a release:
#   git tag v1.0.8 && git push origin v1.0.8
# or run manually from the Actions tab (build only, no release).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write        # create the GitHub Release
  actions: read          # SignPath reads the run + downloads the artifact

jobs:
  build:
    runs-on: windows-latest
    env:
      # empty until the secret is added → the SignPath steps below skip
      # themselves and the build ships unsigned.
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.22.2

      - name: Check version tag matches clearscanner/_version.py
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver = (Get-Content clearscanner/_version.py -TotalCount 1) -replace '.*"(.+)".*','$1'
          $tag = "${{ github.ref_name }}".TrimStart('v')
          if ($ver -ne $tag) { throw "tag $tag != _version.py $ver" }
          echo "APP_VERSION=$ver" >> $env:GITHUB_ENV

      - name: Build the app (PyInstaller)
        run: python -m PyInstaller --noconfirm "Desktop Scanner.spec"

      # --- Sign the app exe (SignPath, round 1) ------------------------
      # Enabled once SIGNPATH_API_TOKEN is set in repo secrets; until then
      # the build ships unsigned.
      - name: Upload unsigned app exe
        if: env.SIGNPATH_API_TOKEN != ''
        id: unsigned-exe
        uses: actions/upload-artifact@v4
        with:
          name: app-exe
          path: 'dist/Desktop Scanner/Desktop Scanner.exe'
          if-no-files-found: error

      - name: Sign app exe
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: 'desktop-scanner'
          signing-policy-slug: 'release-signing'
          artifact-configuration-slug: 'app-exe'
          github-artifact-id: '${{ steps.unsigned-exe.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'dist/Desktop Scanner'   # signed exe drops back in place

      # --- Build the installer (bundles the now-signed exe) -----------
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\DesktopScanner.iss'

      # --- Sign the installer (SignPath, round 2) --------------------
      - name: Upload unsigned installer
        if: env.SIGNPATH_API_TOKEN != ''
        id: unsigned-setup
        uses: actions/upload-artifact@v4
        with:
          name: installer-unsigned
          path: 'installer/Output/DesktopScanner-Setup-*.exe'
          if-no-files-found: error

      - name: Sign installer
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: 'desktop-scanner'
          signing-policy-slug: 'release-signing'
          artifact-configuration-slug: 'installer'
          github-artifact-id: '${{ steps.unsigned-setup.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'installer/Output'        # signed installer overwrites the unsigned one

      # --- Publish ---------------------------------------------------
      - name: Upload installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesktopScanner-Setup
          path: 'installer/Output/DesktopScanner-Setup-*.exe'
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem installer/Output/DesktopScanner-Setup-*.exe | Select-Object -First 1
          gh release create ${{ github.ref_name }} $exe.FullName `
            --title "Desktop Scanner ${{ github.ref_name }}" `
            --notes "Automated build. See the commit log for what changed."
